[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wikipedia-ml-data-pipeline"
version = "0.2.0"
description = "Reproducible pipelines from Wikimedia dumps to auditable, model-ready datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jeff Cadet" }]
keywords = ["wikipedia", "machine-learning", "datasets", "etl", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.28,<1",
  "mwparserfromhell>=0.7,<1",
  "numpy>=2,<3",
  "pyarrow>=20,<27",
  "tokenizers>=0.21,<1",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "twine>=7,<8",
]

[project.scripts]
wikiml = "wikiml.cli:main"

[project.urls]
Homepage = "https://github.com/edcadet10/wikipedia-ml-data-pipeline"
Documentation = "https://github.com/edcadet10/wikipedia-ml-data-pipeline/tree/main/docs"
Issues = "https://github.com/edcadet10/wikipedia-ml-data-pipeline/issues"
Source = "https://github.com/edcadet10/wikipedia-ml-data-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wikiml"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mwparserfromhell", "pyarrow", "pyarrow.*", "tokenizers"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.format]
docstring-code-format = true
